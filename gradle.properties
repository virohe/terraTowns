# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.227
neo_min_version=21.1.1
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=terra_towns
# The human-readable display name for the mod.
mod_name=Cobblemon: Terra Towns
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=0.4.13
# The group ID for the mod. It should match the base package used for the mod sources.
mod_group_id=com.terraTowns

## Integration toggle
# As of 0.1 Cobblemon, Create and Terra Incognita are HARD (required) runtime deps
# (see neoforge.mods.toml), so the integration classpath is enabled by default: the
# default is now TRUE so the compileOnly API stubs are on the classpath for compilation.
#
# IMPORTANT (build resilience): the current stub/hook classes reference NO foreign
# types yet, so the core module compiles either way. Any individual third-party
# compileOnly artifact whose Maven coordinates are not yet confirmed is commented out
# in build.gradle so a clean build still succeeds even with this flag on. Uncomment a
# coordinate there only once it has been verified to resolve.
enable_integrations=true

## Integration dependency versions (compileOnly — resolved against the published Maven artifacts)
## These are companion/runtime mods. They are declared compileOnly so the API is present
## at compile time only and is not bundled into the jar.
# GeckoLib (animation library; also a transitive Cobblemon dependency)
geckolib_version=4.7.1.1
# Cobblemon (NeoForge build). Resolved via Modrinth's maven (build.gradle), NOT a real Maven
# Group:Artifact:Version — Cobblemon has no public GAV coordinate; Modrinth publishes it as
# maven.modrinth:cobblemon:<version-file-id>. Verified 2026-09-26 by querying the Modrinth API
# (api.modrinth.com/v2/project/cobblemon/version) for the neoforge build matching 1.21.1;
# confirmed against the jar's actual byte size (139,056,524) installed in the Terra Incognita
# instance. cobblemon_version is now just a human label — bump the id when Cobblemon updates.
cobblemon_version=1.8.1+1.21.1-neoforge
cobblemon_modrinth_version_id=7otgw3aH
# Create (NeoForge). Used for the town-tier train station integration.
create_version=6.0.4
