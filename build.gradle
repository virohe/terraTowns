plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // --- Integration mod repositories (Cobblemon, GeckoLib, Create) ---
    // These host the API artifacts declared as compileOnly below. They are only
    // contacted when `enable_integrations` is true (see gradle.properties).
    maven {
        name = 'GeckoLib (Cloudsmith)'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    maven {
        name = 'Cobblemon'
        url = 'https://maven.impactdev.net/repository/development/'
    }
    maven {
        name = 'CreateMod (JitPack mirror)'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected from
    // src/main/resources/META-INF/accesstransformer.cfg when present.

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Headless placement harness: boots a dedicated server in run-hamlettest/, lets
        // WorldEvents build its 8 spawn hamlets, has HamletAudit re-measure every piece into
        // hamlet-audit.json, then halts. run-hamlettest/mods/ holds lowcodefml stubs for the
        // three hard-dependency mods so the server can boot without them. Dev-only: nothing
        // here affects the published jar.
        hamletTest {
            server()
            programArgument '--nogui'
            gameDirectory = file('run-hamlettest')
            systemProperty 'terratowns.hamletAudit',
                    file('run-hamlettest/hamlet-audit.json').absolutePath
            systemProperty 'terratowns.hamletAuditExit', 'true'
            // Exercises the 0.4 job system end to end. MUTATES settlements (clears gyms,
            // registers buildings, forces professions) — only ever set against this run's
            // disposable world. See JobAudit.
            systemProperty 'terratowns.jobAuditMutate', 'true'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // --- Companion / integration mods (compileOnly) ---
    //
    // Cobblemon, GeckoLib and Create are RUNTIME companions, not hard build
    // requirements. They are declared `compileOnly` so their APIs are visible
    // during compilation but are NOT bundled into the jar and are NOT forced
    // onto downstream consumers. In neoforge.mods.toml they are listed as
    // `optional` dependencies.
    //
    // The current stub classes deliberately do not reference any Cobblemon /
    // GeckoLib / Create types yet, so the core module compiles with or without
    // these artifacts on the classpath. Resolution of the third-party mavens is
    // therefore gated behind the `enable_integrations` flag (gradle.properties)
    // so an offline / first-time build always succeeds. Flip it to true once the
    // coordinates below match the versions in your dev instance.
    if (project.findProperty('enable_integrations')?.toBoolean()) {
        // --- Third-party integration APIs ---
        // Cobblemon IS verified (2026-09-26) and enabled below via Modrinth's maven -- see
        // cobblemon_modrinth_version_id in gradle.properties. The rest remain unverified.
        //
        // Cobblemon, Create and Terra Incognita are now REQUIRED at runtime
        // (neoforge.mods.toml); GeckoLib is a transitive Cobblemon dependency. They are
        // declared compileOnly so their APIs would be visible at compile time without being
        // bundled. However the exact, currently published Maven coordinates for the 1.21.1 /
        // NeoForge builds have NOT been confirmed to resolve from this build — the values in
        // gradle.properties below were tried and 404'd against every configured repo. The
        // stub/hook classes reference no foreign types yet, so the module compiles without
        // them; each line is therefore left COMMENTED OUT to keep a clean build green.
        //
        // Verify a coordinate against its maven and uncomment ONE AT A TIME before relying
        // on that API at compile time:
        //
        // GeckoLib (animation API; transitive Cobblemon dep) — Cloudsmith maven:
        //   compileOnly "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
        //
        // Cobblemon (NeoForge) — maven.impactdev.net:
        compileOnly "maven.modrinth:cobblemon:${cobblemon_modrinth_version_id}"
        // Cobblemon's classes reference Kotlin runtime markers (e.g. KMappedMarker) that javac
        // needs on the compile classpath to resolve, even though nothing here calls Kotlin code
        // directly. Compile-only: "Kotlin for NeoForge" supplies the real runtime jar in-game.
        compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
        //
        // Create (NeoForge 1.21.1) — maven.createmod.net:
        //   compileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
        //
        // Terra Incognita — no public maven known; add via a local file/flatDir or its own
        // repository once available:
        //   compileOnly "<group>:<artifact>:<version>"
    }
}

// Mod metadata is a static file at src/main/resources/META-INF/neoforge.mods.toml.
// (The template-expansion approach used by the MDK is intentionally not used here; all
// values are known at authoring time and a static toml avoids a Groovy templating step.)

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
